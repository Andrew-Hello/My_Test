name: Office PDF Converter Check

on:
  push:
    branches: [dev]
    paths:
      - 'Office_HQ_PDF_Converter/**'
      - 'Local_Environment_Collector/**'
      - '.github/workflows/office-pdf-script-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-regression-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            'Office_HQ_PDF_Converter/Convert-OfficeToPDF.ps1',
            'Local_Environment_Collector/Collect-Local-Environment.ps1'
          )
          $hasErrors = $false
          foreach ($path in $paths) {
            Write-Host "Checking $path"
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $hasErrors = $true
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            } else {
              Write-Host "Syntax OK: $path"
            }
          }
          if ($hasErrors) { exit 1 }

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse Python scripts
        run: |
          python -m py_compile Office_HQ_PDF_Converter/src/HQImageRebuilder.py
          python -m py_compile Office_HQ_PDF_Converter/test/Analyze-PDF-Quality.py

      - name: Install production Python dependencies
        run: python -m pip install --upgrade pymupdf pillow

      - name: Rebuild DOCX baseline without Office or Acrobat
        run: |
          python Office_HQ_PDF_Converter/src/HQImageRebuilder.py \
            --source-office Office_HQ_PDF_Converter/test/samples/demo_Report.docx \
            --input-pdf Office_HQ_PDF_Converter/test/samples/demo_Report_lowres.pdf \
            --output-pdf /tmp/demo_Report_rebuilt.pdf \
            --report /tmp/rebuild.json

      - name: Validate DOCX baseline restored image count
        run: |
          python - <<'PY'
          import json
          report = json.load(open('/tmp/rebuild.json', encoding='utf-8'))
          print(json.dumps({
              'matching_engine': report.get('matching_engine'),
              'source_images': report.get('source_raster_media_count'),
              'source_candidates': report.get('source_candidate_count'),
              'docx_semantic_pictures': report.get('docx_semantic_picture_count'),
              'docx_crop_candidates': report.get('docx_crop_candidate_count'),
              'pdf_soft_masks': report.get('pdf_soft_mask_reconstructed_count'),
              'pdf_images': report.get('pdf_unique_raster_image_count'),
              'replaced': report.get('replaced_count'),
          }, indent=2))
          if report.get('replaced_count', 0) < 20:
              raise SystemExit('Regression: fewer than 20 baseline DOCX image objects were restored')
          if report.get('replacement_errors'):
              raise SystemExit('DOCX baseline replacement errors detected')
          PY

      - name: Measure rebuilt DOCX baseline PPI
        run: |
          python Office_HQ_PDF_Converter/test/Analyze-PDF-Quality.py \
            --source-docx Office_HQ_PDF_Converter/test/samples/demo_Report.docx \
            --pdf Office_HQ_PDF_Converter/test/samples/demo_Report_lowres.pdf \
            --pdf /tmp/demo_Report_rebuilt.pdf \
            --json-out /tmp/quality.json \
            --md-out /tmp/quality.md
          python - <<'PY'
          import json
          q = json.load(open('/tmp/quality.json', encoding='utf-8'))
          low, rebuilt = q['pdfs']
          print('Low-res median PPI:', low['effective_ppi']['median'])
          print('Rebuilt median PPI:', rebuilt['effective_ppi']['median'])
          print('Rebuilt placements >=600 PPI:', rebuilt['effective_ppi']['placements_ge_600'])
          if rebuilt['effective_ppi']['median'] < 600:
              raise SystemExit('Regression: rebuilt median PPI fell below 600')
          if rebuilt['effective_ppi']['placements_ge_600'] < 30:
              raise SystemExit('Regression: too few >=600 PPI image placements')
          PY

      - name: Exercise crop-aware PPTX semantic matching
        run: |
          python Office_HQ_PDF_Converter/src/HQImageRebuilder.py \
            --source-office Office_HQ_PDF_Converter/test/samples/current/demo_pptx.pptx \
            --input-pdf Office_HQ_PDF_Converter/test/samples/current/demo_pptx_HQ.pdf \
            --output-pdf /tmp/demo_pptx_cropaware.pdf \
            --report /tmp/pptx_cropaware.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/pptx_cropaware.json', encoding='utf-8'))
          summary = {
              'matching_engine': r.get('matching_engine'),
              'unique_media': r.get('source_raster_media_count'),
              'source_candidates': r.get('source_candidate_count'),
              'crop_candidates': r.get('pptx_crop_candidate_count'),
              'semantic_crop_replaced': r.get('pptx_semantic_crop_replaced_count'),
              'soft_masks': r.get('pdf_soft_mask_reconstructed_count'),
              'pdf_images': r.get('pdf_unique_raster_image_count'),
              'replaced': r.get('replaced_count'),
              'replacement_errors': len(r.get('replacement_errors') or []),
          }
          print(json.dumps(summary, indent=2))
          if r.get('pptx_crop_candidate_count', 0) < 1:
              raise SystemExit('PPTX sample did not expose any srcRect crop candidates')
          if r.get('pptx_semantic_crop_replaced_count', 0) < 1:
              raise SystemExit('PPTX sample did not exercise semantic crop restoration')
          if r.get('replaced_count', 0) < 9:
              raise SystemExit('Regression: PPTX source preservation fell below previous baseline')
          if r.get('replacement_errors'):
              raise SystemExit('PPTX replacement errors detected')
          PY

      - name: Exercise DOCX relationship and soft-mask matching
        run: |
          python Office_HQ_PDF_Converter/src/HQImageRebuilder.py \
            --source-office 'Office_HQ_PDF_Converter/test/samples/validation_20260905/docx/Test_docx (2).docx' \
            --input-pdf 'Office_HQ_PDF_Converter/test/samples/validation_20260905/docx/Test_docx (2)_HQ.pdf' \
            --output-pdf /tmp/validation_docx2_semantic.pdf \
            --report /tmp/validation_docx2_semantic.json
          python - <<'PY'
          import json
          r = json.load(open('/tmp/validation_docx2_semantic.json', encoding='utf-8'))
          summary = {
              'matching_engine': r.get('matching_engine'),
              'unique_media': r.get('source_raster_media_count'),
              'source_candidates': r.get('source_candidate_count'),
              'semantic_pictures': r.get('docx_semantic_picture_count'),
              'crop_candidates': r.get('docx_crop_candidate_count'),
              'semantic_picture_replaced': r.get('docx_semantic_picture_replaced_count'),
              'semantic_crop_replaced': r.get('docx_semantic_crop_replaced_count'),
              'soft_masks': r.get('pdf_soft_mask_reconstructed_count'),
              'pdf_images': r.get('pdf_unique_raster_image_count'),
              'replaced': r.get('replaced_count'),
              'replacement_errors': len(r.get('replacement_errors') or []),
          }
          print(json.dumps(summary, indent=2))
          if r.get('docx_semantic_picture_count', 0) < 1:
              raise SystemExit('DOCX validation file did not expose relationship-backed picture candidates')
          if r.get('replaced_count', 0) < 1:
              raise SystemExit('Regression: DOCX validation file lost its previously safe replacement')
          if r.get('replacement_errors'):
              raise SystemExit('DOCX semantic replacement errors detected')
          PY
