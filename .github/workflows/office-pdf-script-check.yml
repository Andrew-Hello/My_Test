name: Office PDF Converter Script Check

on:
  push:
    branches: [dev]
    paths:
      - 'Office_HQ_PDF_Converter/**'
      - '.github/workflows/office-pdf-script-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  powershell-syntax-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $paths = @(
            'Office_HQ_PDF_Converter/Convert-OfficeToPDF.ps1',
            'Office_HQ_PDF_Converter/Convert-OfficeToPDF-v2.ps1',
            'Office_HQ_PDF_Converter/Convert-OfficeToPDF-v3.ps1',
            'Office_HQ_PDF_Converter/Test-WordFixedFormat2-HQ.ps1'
          )

          $hasErrors = $false
          foreach ($path in $paths) {
            Write-Host "Checking $path"
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            )

            if ($errors.Count -gt 0) {
              $hasErrors = $true
              $errors | ForEach-Object { Write-Error "$path : $($_.Message)" }
            } else {
              Write-Host "Syntax OK: $path"
            }
          }

          if ($hasErrors) { exit 1 }
          Write-Host 'All PowerShell syntax checks passed.'

      - name: Parse Python rebuilder
        run: python -m py_compile Office_HQ_PDF_Converter/Rebuild-HighRes-PDF-Images.py
