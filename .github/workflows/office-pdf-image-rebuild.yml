name: Office PDF High-Res Image Rebuild

on:
  push:
    branches: [dev]
    paths:
      - 'Office_HQ_PDF_Converter/Rebuild-HighRes-PDF-Images.py'
      - 'Office_HQ_PDF_Converter/Analyze-PDF-Quality.py'
      - 'Office_HQ_PDF_Converter/demo_Report.docx'
      - 'Office_HQ_PDF_Converter/demo_Report.pdf'
      - 'Office_HQ_PDF_Converter/demo_Report_HD.pdf'
      - '.github/workflows/office-pdf-image-rebuild.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-and-compare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pymupdf pillow ImageHash

      - name: Rebuild PDF images from DOCX originals
        run: |
          python Office_HQ_PDF_Converter/Rebuild-HighRes-PDF-Images.py \
            --source-docx Office_HQ_PDF_Converter/demo_Report.docx \
            --input-pdf Office_HQ_PDF_Converter/demo_Report.pdf \
            --output-pdf Office_HQ_PDF_Converter/demo_Report_Rebuilt.pdf \
            --report Office_HQ_PDF_Converter/diagnostics/image_rebuild_mapping_latest.json

      - name: Compare low, rebuilt and Acrobat PDFs
        run: |
          python Office_HQ_PDF_Converter/Analyze-PDF-Quality.py \
            --source-docx Office_HQ_PDF_Converter/demo_Report.docx \
            --pdf Office_HQ_PDF_Converter/demo_Report.pdf \
            --pdf Office_HQ_PDF_Converter/demo_Report_Rebuilt.pdf \
            --pdf Office_HQ_PDF_Converter/demo_Report_HD.pdf \
            --json-out Office_HQ_PDF_Converter/diagnostics/rebuild_quality_comparison_latest.json \
            --md-out Office_HQ_PDF_Converter/diagnostics/rebuild_quality_comparison_latest.md

      - name: Commit prototype output and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Office_HQ_PDF_Converter/demo_Report_Rebuilt.pdf \
                  Office_HQ_PDF_Converter/diagnostics/image_rebuild_mapping_latest.json \
                  Office_HQ_PDF_Converter/diagnostics/rebuild_quality_comparison_latest.json \
                  Office_HQ_PDF_Converter/diagnostics/rebuild_quality_comparison_latest.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update high-resolution PDF rebuild prototype results"
            git push origin dev
          fi
